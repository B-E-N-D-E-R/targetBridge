name: Catalina Fork Build

# Builds this fork's two apps:
# - an Intel Receiver that launches on macOS 10.15.7. FFmpeg and SDL2 are
#   compiled from source for the 10.15 deployment target and linked statically,
#   because Homebrew bottles only run on the macOS release they were built for;
# - the Sender (macOS 14+), with the built-in Ethernet / USB transport.
#
# Run it from the Actions tab (workflow_dispatch) and download the artifacts,
# push a tag such as `catalina-v3.5.2` to publish a draft release, or publish
# a public pre-release for hardware testing by pushing a `catalina-test-<n>`
# tag or running the workflow with "Publish a public test pre-release" ticked.

on:
  workflow_dispatch:
    inputs:
      test_release:
        description: 'Publish a public test pre-release (catalina-test-<run number>)'
        type: boolean
        default: false
  push:
    branches: [ main, catalina-receiver ]
    tags: [ 'catalina-v*', 'catalina-test-*' ]
  pull_request:
    paths:
      - 'TargetBridge-Receiver/**'
      - 'TargetBridge-Shared/**'
      - 'TargetBridge-Sender/**'
      - '.github/workflows/catalina-fork.yml'

permissions:
  contents: write

jobs:
  build-sender:
    name: Build Sender (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Tools
        run: brew install jq xcodegen

      - name: Build Sender App
        run: |
          cd TargetBridge-Sender
          ./scripts/build_targetbridge_sender_app.sh
          file ../build/TargetBridge.app/Contents/MacOS/TargetBridge | grep -q "${{ matrix.arch }}"

      - name: Run Sender Unit Tests
        run: |
          cd TargetBridge-Sender
          xcodebuild test -project TargetBridge.xcodeproj -scheme TBDisplaySender -destination 'platform=macOS' -derivedDataPath .build/DerivedData

      - name: Check Sender Permission Probe
        run: ruby TargetBridge-Sender/scripts/test_permission_status.rb sender build/TargetBridge.app/Contents/MacOS/TargetBridge

      - name: Zip App Bundle
        run: |
          cd build
          ditto -c -k --keepParent TargetBridge.app TargetBridge-${{ matrix.arch }}.app.zip

      - name: Upload Sender Artifact
        uses: actions/upload-artifact@v7
        with:
          name: TargetBridge-${{ matrix.arch }}.app.zip
          path: build/TargetBridge-${{ matrix.arch }}.app.zip

  build-receiver-catalina:
    name: Build Receiver (macOS 10.15, x86_64)
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Build Tools
        run: brew install cmake nasm pkgconf dylibbundler jq

      - name: Restore Legacy Dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: legacy-deps
          key: legacy-deps-${{ runner.os }}-x86_64-10.15-${{ hashFiles('TargetBridge-Receiver/scripts/build_legacy_deps.sh') }}

      - name: Build FFmpeg and SDL2 for macOS 10.15
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./TargetBridge-Receiver/scripts/build_legacy_deps.sh "$GITHUB_WORKSPACE/legacy-deps"

      - name: Check Localizations
        run: ./TargetBridge-Shared/scripts/check_localizations.sh

      - name: Run Receiver Unit Tests
        run: |
          cd TargetBridge-Receiver/TBReceiverC
          make test

      - name: Build Receiver App
        env:
          PKG: pkgconf --static
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/legacy-deps/lib/pkgconfig
          CFLAGS: -Werror=unguarded-availability-new
        run: |
          set -o pipefail
          cd TargetBridge-Receiver
          ./scripts/build_tbreceiver_c_app.sh 2>&1 | tee "$RUNNER_TEMP/receiver-build.log"
          # ld only warns when a linked object targets a newer macOS; on
          # Catalina that object would fail at launch, so treat it as an error.
          if grep -q "built for newer macOS version" "$RUNNER_TEMP/receiver-build.log"; then
            echo "::error::An object in the link targets a newer macOS than 10.15"
            exit 1
          fi

      - name: Verify Catalina Compatibility
        run: |
          APP="build/TargetBridge Receiver.app"
          BIN="$APP/Contents/MacOS/TargetBridgeReceiver"
          file "$BIN" | grep -q x86_64

          MINOS="$(otool -l "$BIN" | awk '/cmd LC_BUILD_VERSION/{f=1} f && $1=="minos"{print $2; exit}')"
          echo "Executable minos: $MINOS"
          if [[ "$MINOS" != "10.15" ]]; then
            echo "::error::Executable targets macOS $MINOS, expected 10.15"
            exit 1
          fi

          PLIST_MIN="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          echo "LSMinimumSystemVersion: $PLIST_MIN"
          [[ "$PLIST_MIN" == "10.15" ]]

          # Only OS libraries may be loaded at runtime; FFmpeg and SDL2 are static.
          echo "Linked libraries:"
          otool -L "$BIN" | tail -n +2
          NON_SYSTEM="$(otool -L "$BIN" | tail -n +2 | awk '{print $1}' | grep -Ev '^/(usr/lib|System/Library)/' || true)"
          if [[ -n "$NON_SYSTEM" ]]; then
            echo "::error::Unexpected non-system libraries: $NON_SYSTEM"
            exit 1
          fi

      - name: Fetch macOS 10.15 SDK Symbol Stubs
        run: |
          # Only the .tbd stubs (exported-symbol lists), not the whole SDK.
          git clone --quiet --depth 1 --filter=blob:none --no-checkout \
            https://github.com/phracker/MacOSX-SDKs.git "$RUNNER_TEMP/MacOSX-SDKs"
          cd "$RUNNER_TEMP/MacOSX-SDKs"
          git sparse-checkout set --no-cone 'MacOSX10.15.sdk/**/*.tbd'
          git checkout --quiet

      - name: Check Imports Against macOS 10.15
        run: |
          # The current SDK declares some functions as available on 10.15 that
          # Catalina does not export, which makes dyld refuse to launch the app.
          python3 -I TargetBridge-Receiver/scripts/check_sdk_symbols.py \
            --sdk "$RUNNER_TEMP/MacOSX-SDKs/MacOSX10.15.sdk" \
            "build/TargetBridge Receiver.app/Contents/MacOS/TargetBridgeReceiver"

      - name: Check Receiver Permission Probe
        run: ruby TargetBridge-Sender/scripts/test_permission_status.rb receiver 'build/TargetBridge Receiver.app/Contents/MacOS/TargetBridgeReceiver'

      - name: Zip App Bundle
        run: |
          cd build
          ditto -c -k --keepParent "TargetBridge Receiver.app" TargetBridge-Receiver-catalina-x86_64.app.zip

      - name: Upload Receiver Artifact
        uses: actions/upload-artifact@v7
        with:
          name: TargetBridge-Receiver-catalina-x86_64.app.zip
          path: build/TargetBridge-Receiver-catalina-x86_64.app.zip

  publish-release:
    name: Publish Release
    if: >-
      startsWith(github.ref, 'refs/tags/catalina-v') ||
      startsWith(github.ref, 'refs/tags/catalina-test-') ||
      (github.event_name == 'workflow_dispatch' && inputs.test_release)
    needs: [build-sender, build-receiver-catalina]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('catalina-test-{0}', github.run_number) || github.ref_name }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          assets=(
            artifacts/TargetBridge-Receiver-catalina-x86_64.app.zip
            artifacts/TargetBridge-arm64.app.zip
            artifacts/TargetBridge-x86_64.app.zip
          )
          # A release created on GitHub's Releases page pushes its tag, which
          # runs this workflow; attach the apps to that release.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$REPO" --clobber
          elif [[ "$TAG" == catalina-test-* ]]; then
            # Public so the files download without a GitHub login, e.g. with
            # curl on the iMac, whose Safari may not handle github.com.
            gh release create "$TAG" "${assets[@]}" \
              --repo "$REPO" \
              --target "$TARGET" \
              --title "Test build $TAG (untested)" \
              --notes "Untested build for hardware testing; not a release. Receiver for Intel iMacs on macOS 10.15 Catalina, plus the Sender (macOS 14+) with the built-in Ethernet / USB transport. See docs/Catalina.md on the catalina-receiver branch." \
              --prerelease
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$REPO" \
              --title "TargetBridge Catalina fork $TAG" \
              --notes "Receiver for Intel iMacs on macOS 10.15 Catalina, plus the Sender (macOS 14+) with the built-in Ethernet / USB transport." \
              --draft
          fi
